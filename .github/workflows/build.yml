name: Build macOS App

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --dev --python "$(which python3)"

      - name: Prepare universal2 dependencies
        run: uv run python bin/prepare_universal_deps.py

      - name: Generate app icon
        run: |
          mkdir -p assets/app.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size assets/logo_on.png --out assets/app.iconset/icon_${size}x${size}.png
            double=$((size * 2))
            sips -z $double $double assets/logo_on.png --out assets/app.iconset/icon_${size}x${size}@2x.png
          done
          sips -z 1024 1024 assets/logo_on.png --out assets/app.iconset/icon_512x512@2x.png
          iconutil -c icns assets/app.iconset -o assets/app.icns
          rm -rf assets/app.iconset

      - name: Build app
        run: uv run pyinstaller caffeinate_ui.spec --noconfirm

      - name: Verify universal binary
        run: |
          lipo -archs "dist/Caffeinate UI.app/Contents/MacOS/Caffeinate UI" | grep -q "x86_64"
          lipo -archs "dist/Caffeinate UI.app/Contents/MacOS/Caffeinate UI" | grep -q "arm64"
          echo "Verified universal2 binary (x86_64 + arm64 present)"

      - name: Zip app bundle
        run: cd dist && ditto -c -k --sequesterRsrc --keepParent "Caffeinate UI.app" "Caffeinate-UI-${GITHUB_REF_NAME}.zip"

      - name: Upload release artifact
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Caffeinate-UI-*.zip
